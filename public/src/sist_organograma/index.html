<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/img/logo-ifsul.ico">
    <title>Organograma - Curso Técnico em Desenvolvimento de Sistemas - IFSul</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/common/header.css">
    <link rel="stylesheet" href="../../assets/css/common/footer.css">
    <link rel="stylesheet" href="../../assets/css/organograma/organograma.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <script>
        fetch('../header-new/index.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });



        function renderizarOrganograma(matrizCurricular) {
            const container = document.getElementById('organogram');
            container.innerHTML = '';
            matrizCurricular.forEach(semestre => {
                const semestreDiv = document.createElement('div');
                semestreDiv.className = 'semester';

                const chSemestre = semestre.disciplinas.reduce((total, d) => total + d.chTotal, 0);
                const tituloHtml = `
                <div class="semester-title">
                    <span><i class="bi ${semestre.icone}"></i> ${semestre.titulo}</span>
                    <span class="semester-ch">${chSemestre}h</span>
                </div>`;

                const subjectsDiv = document.createElement('div');
                subjectsDiv.className = 'subjects';
                semestre.disciplinas.forEach(disc => {
                    const ementaHtml = disc.ementa
                        ? `<a class="subject-ementa-btn" href="${disc.ementa}" target="_blank" rel="noopener noreferrer" title="Abrir Ementa"><i class="bi bi-file-earmark-pdf"></i> Ementa</a>`
                        : '';

                    const discHtml = `
                    <div class="subject" data-id="${disc.id}" data-prereq="${disc.prereq}">
                        <div class="subject-body">
                            <div class="subject-name">${disc.nome}</div>
                            <div class="subject-meta">
                                <span class="ch-badge"><i class="bi bi-clock"></i> ${disc.chTotal}h</span>
                                <span class="ch-breakdown">Presencial: ${disc.chPresencial}h | Não presencial: ${disc.chEAD}h</span>
                            </div>
                        </div>
                        <div class="subject-footer">
                            <span class="subject-prof"><i class="bi bi-person"></i> ${disc.professor}</span>
                            ${ementaHtml}
                        </div>
                    </div>
                `;
                    subjectsDiv.innerHTML += discHtml;
                });
                semestreDiv.innerHTML += tituloHtml;
                semestreDiv.appendChild(subjectsDiv);
                container.appendChild(semestreDiv);
            });
        }
        // Carrega o JSON via fetch e, em seguida, chama a renderização
        document.addEventListener("DOMContentLoaded", () => {
            // Ajuste o caminho abaixo conforme o local onde você salvou o matriz.json
            fetch('../../assets/docs/sist/matriz.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erro ao carregar o arquivo JSON da matriz');
                    }
                    return response.json();
                })
                .then(dados => {
                    renderizarOrganograma(dados);
                })
                .catch(error => {
                    console.error('Erro:', error);
                    document.getElementById('organogram').innerHTML = '<p class="text-danger text-center">Não foi possível carregar a matriz curricular no momento.</p>';
                });
        });
    </script>

    <main>

        <section class="page-header">
            <div class="container text-center">
                <h1><i class="bi bi-diagram-3"></i> Matriz Curricular
                    <hr> Curso Técnico em Desenvolvimento de Sistemas
                </h1>

            </div>
        </section>




        <section class="organogram-section">
            <div class="container" id="organogram">


            </div>
        </section>



    </main>

    <div id="footer-placeholder"></div>
    <script>
        fetch('../footer/index.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script de Autenticação SUAP -->
    <!--script src="../../assets/js/suap-auth.js"></script-->
</body>

</html>
