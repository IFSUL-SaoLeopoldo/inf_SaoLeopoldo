 <div id="header-placeholder"></div>
    <script>
         fetch('../header-new/index.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                ajustarNavbar();
            });

        function ajustarNavbar() {
            let path = window.location.pathname;
            let isHome = path.includes("/home/index.html") || path.endsWith("/home/");

            let navLinks = document.querySelector(".navbar-nav");

            if (!isHome) {
                let homeLink = navLinks.querySelector("a[href='#home']");
                if (homeLink) homeLink.setAttribute("href", "/src/home/index.html");
                
            }
        }

        function renderizarOrganograma(matrizCurricular) {
        const container = document.getElementById('organogram');
        container.innerHTML = ''; 
        matrizCurricular.forEach(semestre => {
            const semestreDiv = document.createElement('div');
            semestreDiv.className = 'semester';
            
            const tituloHtml = `<div class="semester-title"><i class="bi ${semestre.icone}"></i> ${semestre.titulo}</div>`;
            
            const subjectsDiv = document.createElement('div');
            subjectsDiv.className = 'subjects';
            semestre.disciplinas.forEach(disc => {
                const discHtml = `
                    <div class="subject" data-id="${disc.id}" data-prereq="${disc.prereq}">
                        <div class="subject-name">${disc.nome}</div>
                        <a class="subject-link" href="${disc.ementa}" target="_blank" title="Abrir Ementa"><i class="bi bi-file-earmark-pdf"></i></a>
                        <div class="subject-tooltip">
                            <strong>CH Total:</strong> ${disc.chTotal}h <br>
                            <span style="font-size: 0.9em;">(Presencial: ${disc.chPresencial}h | EAD: ${disc.chEAD}h)</span> <br>
                            <hr style="margin: 5px 0; border-color: #ccc;">
                            <strong>Prof:</strong> ${disc.professor}
                        </div>
                    </div>
                `;
                subjectsDiv.innerHTML += discHtml;
            });
            semestreDiv.innerHTML += tituloHtml;
            semestreDiv.appendChild(subjectsDiv);
            container.appendChild(semestreDiv);
        });
    }
    // Carrega o JSON via fetch e, em seguida, chama a renderização
    document.addEventListener("DOMContentLoaded", () => {
        // Ajuste o caminho abaixo conforme o local onde você salvou o matriz.json
        fetch('../../assets/docs/sist/matriz.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erro ao carregar o arquivo JSON da matriz');
                }
                return response.json();
            })
            .then(dados => {
                renderizarOrganograma(dados);
            })
            .catch(error => {
                console.error('Erro:', error);
                document.getElementById('organogram').innerHTML = '<p class="text-danger text-center">Não foi possível carregar a matriz curricular no momento.</p>';
            });
    });
</script>
