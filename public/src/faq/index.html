<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/img/logo-ifsul.ico">
    <title>Inf - Portal da Informática - Perguntas Frequentes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/common/header.css">
    <link rel="stylesheet" href="../../assets/css/faq/faq.css">
    <link rel="stylesheet" href="../../assets/css/common/footer.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <script>
        fetch('../header-new/index.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });

       
    </script>

    <main>
        <section class="hero-section">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-8 mx-auto text-center hero-content">
                        <h1 class="hero-title">Como podemos ajudar?</h1>
                        <p class="hero-subtitle">Busque por tópicos ou navegue pelas categorias abaixo para encontrar as respostas que você precisa.</p>
                        
                        <div class="search-container">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" id="search-input" class="search-input" placeholder="Digite sua dúvida aqui...">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="faq-section">
            <div class="container" id="faq-container">
                <!-- Conteúdo será carregado via JavaScript -->
                <div class="text-center">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script>
        fetch('../footer/index.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="faq.js"></script>
    <!-- Script removido -->
</body>

</html>
